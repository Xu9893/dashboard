<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门店绩效看板 - 必读</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,#0f0c29 0%,#1e1b4b 50%,#24243e 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px;
}
.container{
  max-width:680px;width:100%;
  animation:fadeIn .6s ease-out;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.header{
  text-align:center;margin-bottom:32px;
}
.header h1{
  font-size:28px;font-weight:800;
  background:linear-gradient(135deg,#a78bfa,#60a5fa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;
}
.header .sub{
  color:#94a3b8;font-size:14px;
}
.read-guide{
  background:linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);
  color:#e0e7ff;border-radius:16px;
  padding:28px 32px;margin-bottom:28px;
  box-shadow:0 8px 32px rgba(79,70,229,.3);
  border:1px solid rgba(167,139,250,.15);
}
.read-guide .rg-title{
  font-size:18px;font-weight:700;color:#c7d2fe;
  margin-bottom:16px;display:flex;align-items:center;gap:10px;
}
.read-guide .rg-title::before{content:'📖';font-size:22px}
.read-guide .rg-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px 24px;
}
@media(max-width:500px){
  .read-guide .rg-grid{grid-template-columns:1fr}
}
.read-guide .rg-item{
  font-size:14px;line-height:1.7;padding:4px 0;
}
.read-guide .rg-item b{color:#a5b4fc}
.read-guide .rg-item .unit{color:#94a3b8;font-size:12px;margin-left:3px}
.read-guide .rg-note{
  margin-top:14px;padding-top:14px;
  border-top:1px solid rgba(167,139,250,.2);
  font-size:13px;color:#94a3b8;
}
.read-guide .rg-date{
  margin-top:10px;font-size:12px;color:#64748b;text-align:right;
}
.enter-section{
  text-align:center;
}
.countdown{
  display:inline-flex;align-items:center;justify-content:center;
  width:56px;height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#6366f1);
  color:#fff;font-size:24px;font-weight:800;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(99,102,241,.4);
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 4px 16px rgba(99,102,241,.4)}
  50%{box-shadow:0 4px 32px rgba(99,102,241,.7)}
}
.btn-enter{
  display:inline-block;
  padding:14px 48px;
  border-radius:10px;
  font-size:16px;font-weight:700;
  text-decoration:none;
  transition:all .3s ease;
  cursor:pointer;border:none;
}
.btn-disabled{
  background:rgba(99,102,241,.1);
  color:#64748b;
  pointer-events:none;
  box-shadow:none;
}
.btn-active{
  background:linear-gradient(135deg,#7c3aed,#6366f1);
  color:#fff;
  box-shadow:0 4px 20px rgba(99,102,241,.4);
}
.btn-active:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 28px rgba(99,102,241,.5);
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>荣悦台门店绩效看板</h1>
    <div class="sub">请仔细阅读以下内容后再进入</div>
  </div>

  <div class="read-guide">
    <div class="rg-title">看板必读</div>
    <div class="rg-grid">
      <div class="rg-item"><b>注册数</b><span class="unit">（人）</span>：使用内推码注册的人数</div>
      <div class="rg-item"><b>签约数</b><span class="unit">（对）</span>：门店签约婚宴的对数</div>
      <div class="rg-item"><b>绑定数</b><span class="unit">（对）</span>：完成夫妻绑定的对数</div>
      <div class="rg-item"><b>已填婚期</b><span class="unit">（对）</span>：已经填写婚期的对数</div>
      <div class="rg-item"><b>已分配管家</b><span class="unit">（对）</span>：已经分配好管家的对数</div>
      <div class="rg-item"><b>数据更新</b><span class="unit">（每日）</span>：看板数据每日更新，当天看到的是前一天的数据</div>
    </div>
    <div class="rg-note">注：签约/绑定/婚期/管家均按"对"计，两人 = 一对</div>
    <div class="rg-date" id="updateDate"></div>
  </div>

  <div class="enter-section">
    <div id="countdownEl" class="countdown">3</div>
    <div>
      <a id="btnEnter" class="btn-enter btn-disabled" href="javascript:void(0)">请阅读 3 秒后进入</a>
    </div>
  </div>
</div>

<script>
(function(){
  var btn = document.getElementById('btnEnter');
  var cd = document.getElementById('countdownEl');
  var sec = 3;

  // Set update date
  var now = new Date();
  var yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  var ds = yesterday.getFullYear() + '-' +
    String(yesterday.getMonth()+1).padStart(2,'0') + '-' +
    String(yesterday.getDate()).padStart(2,'0');
  document.getElementById('updateDate').textContent = '数据更新日期：' + ds;

  var ts = Date.now();
  btn.href = 'dashboard.html?v=1780296585' + ts;

  var timer = setInterval(function(){
    sec--;
    if(sec <= 0){
      clearInterval(timer);
      cd.textContent = '✓';
      cd.style.animation = 'none';
      cd.style.background = 'linear-gradient(135deg,#10b981,#059669)';
      btn.className = 'btn-enter btn-active';
      btn.textContent = '进入看板 →';
    } else {
      cd.textContent = sec;
    }
  }, 1000);
})();
</script>
</body>
</html>
